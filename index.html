<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Dual-Theme Network OS</title>
    <style>
        /* --- THEMA 1: SPACE 1999 (Oranje / Retro Sci-Fi) --- */
        body.theme-space1999 {
            --bg-color: #080a0f;
            --panel-bg: #111622;
            --accent: #ff7700;
            --accent-glow: rgba(255, 119, 0, 0.4);
            --text-main: #ffbb55;
            --border-style: 2px solid #ff7700;
            --font-family: 'Courier New', Courier, monospace;
            --wallpaper-bg: radial-gradient(circle, #1a2238 0%, #05070a 100%);
        }

        /* --- THEMA 2: GROENE TERMINAL (Eerste Home Computer / CRT Groen) --- */
        body.theme-terminal {
            --bg-color: #020802;
            --panel-bg: #051405;
            --accent: #00ff66;
            --accent-glow: rgba(0, 255, 102, 0.4);
            --text-main: #00ff66;
            --border-style: 1px solid #00ff66;
            --font-family: 'Courier New', Courier, monospace;
            --wallpaper-bg: radial-gradient(circle, #032003 0%, #010401 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); text-transform: uppercase; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg-color); color: var(--text-main); transition: background 0.3s, color 0.3s; }

        /* CRT Scanline Effect */
        body::after {
            content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            z-index: 99999; background-size: 100% 3px, 3px 100%; pointer-events: none;
        }

        #wallpaper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--wallpaper-bg); z-index: 0; transition: background 0.3s;
        }

        /* Inlogscherm */
        #lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 4, 8, 0.96); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.4s ease;
        }
        .lock-box {
            background: var(--panel-bg); border: var(--border-style);
            padding: 40px; box-shadow: 0 0 25px var(--accent-glow);
            text-align: center; width: 380px;
        }
        .lock-box h2 { color: var(--accent); margin-bottom: 10px; letter-spacing: 3px; font-size: 20px; }
        .lock-box p { font-size: 10px; color: #8899aa; margin-bottom: 25px; }
        .lock-box input {
            width: 100%; padding: 12px; margin-bottom: 15px; background: #000;
            border: 1px solid var(--accent); color: var(--text-main); text-align: center; font-size: 16px;
        }
        .lock-box button {
            width: 100%; padding: 12px; background: var(--accent); border: none;
            color: #000; font-weight: bold; cursor: pointer; font-size: 14px; letter-spacing: 2px; transition: 0.2s;
        }
        .lock-box button:hover { opacity: 0.8; }

        #desktop { position: relative; width: 100%; height: 100%; z-index: 1; display: none; }

        /* Taakbalk */
        .taskbar {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 50px;
            background: var(--panel-bg); border-top: var(--border-style);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; z-index: 1000; transition: background 0.3s, border-color 0.3s;
        }
        .taskbar-left, .taskbar-right { display: flex; align-items: center; gap: 10px; }
        .taskbar-btn {
            background: #000; border: 1px solid var(--accent); color: var(--accent);
            padding: 8px 14px; cursor: pointer; font-size: 11px; letter-spacing: 1px; transition: 0.2s;
        }
        .taskbar-btn:hover { background: var(--accent); color: #000; }
        
        .sys-tray {
            font-size: 11px; color: var(--text-main); display: flex; align-items: center; gap: 15px;
            border: 1px solid var(--accent); padding: 5px 10px; background: #000;
        }

        /* Venstersysteem */
        .window {
            position: absolute; top: 70px; left: 100px; width: 620px; height: 460px;
            background: var(--panel-bg); border: var(--border-style);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; overflow: hidden; resize: both; z-index: 10;
        }
        .window-header {
            background: #000; padding: 8px 12px; display: flex;
            justify-content: space-between; align-items: center; cursor: move; user-select: none;
            border-bottom: var(--border-style);
        }
        .window-title { font-size: 12px; font-weight: bold; color: var(--accent); letter-spacing: 2px; }
        
        .window-controls { display: flex; align-items: center; gap: 4px; }
        .window-controls button {
            background: #000; border: 1px solid var(--accent); width: 28px; height: 24px; cursor: pointer;
            font-size: 11px; color: var(--accent); display: flex; align-items: center; justify-content: center; transition: 0.1s;
        }
        .window-controls button:hover { background: var(--accent); color: #000; }
        .window-controls .btn-close:hover { background: #ff3333; border-color: #ff3333; color: #fff; }

        .window-content { padding: 20px; flex-grow: 1; overflow-y: auto; background: #000; color: var(--text-main); font-size: 13px; }

        /* Instellingen Popup met Thema-keuze */
        .settings-popup {
            position: absolute; bottom: 60px; right: 20px; width: 340px;
            background: var(--panel-bg); border: var(--border-style);
            padding: 20px; z-index: 2000; display: none; box-shadow: 0 0 20px var(--accent-glow);
        }
        .settings-popup label { display: block; margin-bottom: 12px; font-size: 11px; color: var(--text-main); }
        .settings-popup select, .settings-popup input[type="text"] {
            width: 100%; padding: 8px; background: #000; border: 1px solid var(--accent); color: var(--text-main); margin-top: 5px; font-size: 12px;
        }
    </style>
</head>
<body class="theme-space1999">

    <div id="wallpaper"></div>

    <!-- Inlogscherm -->
    <div id="lock-screen">
        <div class="lock-box">
            <h2>RETRO SYSTEM</h2>
            <p>Select Theme & Authorize Access</p>
            <div style="margin-bottom: 15px; text-align: left;">
                <label style="font-size: 10px; color: var(--accent);">Startup Theme:</label>
                <select id="login-theme-select" style="width:100%; padding:8px; background:#000; border:1px solid var(--accent); color:var(--text-main); font-size:11px; margin-top:4px;">
                    <option value="theme-space1999">Space: 1999 (Moonbase Alpha)</option>
                    <option value="theme-terminal">Classic Home Computer (Green CRT)</option>
                </select>
            </div>
            <input type="password" id="pass-input" placeholder="Security Code...">
            <button onclick="retroOS.login()">INITIALIZE OS</button>
            <button onclick="retroOS.toggleLogin(false)" style="background:transparent; border:none; color:#556677; margin-top:15px; cursor:pointer; font-size:9px;">Bypass Login</button>
        </div>
    </div>

    <!-- Desktop -->
    <div id="desktop">
        <div class="taskbar">
            <div class="taskbar-left">
                <button class="taskbar-btn" onclick="retroOS.openSettings()">[SYS] CONFIG & THEMES</button>
                <button class="taskbar-btn" onclick="retroOS.openAppPrompt()">[+] LOAD MODULE</button>
            </div>
            <div class="taskbar-right">
                <div class="sys-tray">
                    <span id="tray-theme-label">THEME: ACTIVE</span>
                    <span id="system-time">00:00:00</span>
                    <span id="system-date">01.01.1999</span>
                </div>
            </div>
        </div>

        <!-- Instellingen Popup met Thema-wisselaar -->
        <div id="settings-panel" class="settings-popup">
            <h3 style="color: var(--accent); margin-bottom: 15px; font-size: 13px; letter-spacing: 1px;">System & Theme Control</h3>
            <label>
                Active Retro Theme:
                <select id="theme-switcher" onchange="retroOS.setTheme(this.value)">
                    <option value="theme-space1999">Space: 1999 (Moonbase Alpha)</option>
                    <option value="theme-terminal">Classic Green CRT Terminal</option>
                </select>
            </label>
            <label>
                <input type="checkbox" id="login-toggle-check" onchange="retroOS.toggleLoginSetting(this)"> Security Login Active
            </label>
            <label>
                Google Sheets Webhook URL:
                <input type="text" id="sheets-url-input" placeholder="https://script.google.com/macros/s/.../exec">
            </label>
            <button class="taskbar-btn" style="width:100%; margin-top:10px; background:var(--accent); color:#000;" onclick="retroOS.saveSettings()">Save Configuration</button>
        </div>
    </div>

    <script>
        /* --- GELUIDSENGINE --- */
        const SoundFX = {
            ctx: null,
            init() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            play(freq, duration, type='square') {
                try {
                    this.init();
                    let osc = this.ctx.createOscillator();
                    let gain = this.ctx.createGain();
                    osc.type = type; osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.00001, this.ctx.currentTime + duration);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            },
            startup(theme) {
                if(theme === 'theme-terminal') {
                    [300, 450, 600].forEach((f, i) => setTimeout(() => this.play(f, 0.08, 'sine'), i * 60));
                } else {
                    [440, 880, 1320, 1760].forEach((f, i) => setTimeout(() => this.play(f, 0.1, 'square'), i * 80));
                }
            },
            click() { this.play(1000, 0.02, 'sawtooth'); }
        };

        class RetroOS {
            constructor() {
                this.loginEnabled = localStorage.getItem('retro_login') !== 'false';
                this.sheetsUrl = localStorage.getItem('retro_sheets') || '';
                this.currentTheme = localStorage.getItem('retro_theme') || 'theme-space1999';

                // Pas thema toe
                this.setTheme(this.currentTheme, false);
                document.getElementById('theme-switcher').value = this.currentTheme;
                document.getElementById('login-theme-select').value = this.currentTheme;
                document.getElementById('sheets-url-input').value = this.sheetsUrl;
                document.getElementById('login-toggle-check').checked = this.loginEnabled;

                if (!this.loginEnabled) {
                    document.getElementById('lock-screen').style.display = 'none';
                    document.getElementById('desktop').style.display = 'block';
                    SoundFX.startup(this.currentTheme);
                }

                setInterval(() => {
                    let d = new Date();
                    document.getElementById('system-time').innerText = d.toLocaleTimeString();
                    document.getElementById('system-date').innerText = d.toLocaleDateString();
                }, 1000);
            }

            setTheme(themeClass, playSound=true) {
                this.currentTheme = themeClass;
                document.body.className = themeClass;
                localStorage.setItem('retro_theme', themeClass);
                document.getElementById('tray-theme-label').innerText = themeClass === 'theme-terminal' ? 'CRT GREEN' : 'ALPHA 1999';
                if(playSound) SoundFX.click();
            }

            login() {
                let selectedTheme = document.getElementById('login-theme-select').value;
                this.setTheme(selectedTheme, false);
                SoundFX.play(1400, 0.15);
                document.getElementById('lock-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('lock-screen').style.display = 'none';
                    document.getElementById('desktop').style.display = 'block';
                    SoundFX.startup(this.currentTheme);
                }, 400);
            }

            toggleLogin(enabled) {
                this.loginEnabled = enabled;
                localStorage.setItem('retro_login', enabled);
                if(!enabled) this.login();
            }

            toggleLoginSetting(el) {
                this.toggleLogin(el.checked);
            }

            openSettings() {
                SoundFX.click();
                let panel = document.getElementById('settings-panel');
                panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
            }

            saveSettings() {
                this.sheetsUrl = document.getElementById('sheets-url-input').value;
                localStorage.setItem('retro_sheets', this.sheetsUrl);
                SoundFX.click();
                this.openSettings();
            }

            async saveData(key, value) {
                if(!this.sheetsUrl) {
                    alert("ERROR: No Google Sheets Webhook configured.");
                    return false;
                }
                try {
                    await fetch(this.sheetsUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ action: 'save', key: key, value: value })
                    });
                    return true;
                } catch(e) {
                    alert("TRANSMISSION ERROR: " + e.message);
                    return false;
                }
            }

            async loadData() {
                if(!this.sheetsUrl) return {};
                try {
                    let res = await fetch(this.sheetsUrl);
                    let data = await res.json();
                    return data;
                } catch(e) {
                    return {};
                }
            }

            openAppPrompt() {
                SoundFX.click();
                let url = prompt("ENTER MODULE HTML URL (GITHUB RAW LINK):");
                if(url) this.loadHTMLApp(url);
            }

            async loadHTMLApp(url) {
                try {
                    SoundFX.click();
                    let res = await fetch(url);
                    let htmlContent = await res.text();

                    let winId = 'win-' + Date.now();
                    let win = document.createElement('div');
                    win.className = 'window';
                    win.id = winId;
                    win.innerHTML = `
                        <div class="window-header" onmousedown="retroOS.initDrag(event, '${winId}')">
                            <span class="window-title">[MODULE ACTIVE]</span>
                            <div class="window-controls">
                                <button onclick="retroOS.minimizeWindow('${winId}')" title="Minimize">_</button>
                                <button onclick="retroOS.maximizeWindow('${winId}')" title="Maximize">[]</button>
                                <button class="btn-close" onclick="document.getElementById('${winId}').remove()" title="Terminate">X</button>
                            </div>
                        </div>
                        <div class="window-content" id="content-${winId}"></div>
                    `;
                    document.getElementById('desktop').appendChild(win);
                    document.getElementById(`content-${winId}`).innerHTML = htmlContent;

                    let scripts = document.getElementById(`content-${winId}`).querySelectorAll('script');
                    scripts.forEach(s => {
                        let ns = document.createElement('script');
                        ns.text = s.innerHTML;
                        document.body.appendChild(ns);
                    });
                } catch(e) {
                    alert("FAILED TO LOAD MODULE: " + e.message);
                }
            }

            maximizeWindow(winId) {
                SoundFX.click();
                let win = document.getElementById(winId);
                if(win.dataset.maximized === 'true') {
                    win.style.top = win.dataset.prevTop;
                    win.style.left = win.dataset.prevLeft;
                    win.style.width = win.dataset.prevWidth;
                    win.style.height = win.dataset.prevHeight;
                    win.dataset.maximized = 'false';
                } else {
                    win.dataset.prevTop = win.style.top;
                    win.dataset.prevLeft = win.style.left;
                    win.dataset.prevWidth = win.style.width;
                    win.dataset.prevHeight = win.style.height;
                    win.style.top = '10px';
                    win.style.left = '10px';
                    win.style.width = 'calc(100vw - 20px)';
                    win.style.height = 'calc(100vh - 70px)';
                    win.dataset.maximized = 'true';
                }
            }

            minimizeWindow(winId) {
                SoundFX.click();
                document.getElementById(winId).style.display = 'none';
            }

            initDrag(e, winId) {
                let win = document.getElementById(winId);
                let startX = e.clientX, startY = e.clientY;
                let startLeft = win.offsetLeft, startTop = win.offsetTop;

                function onMouseMove(e) {
                    win.style.left = (startLeft + e.clientX - startX) + 'px';
                    win.style.top = (startTop + e.clientY - startY) + 'px';
                }
                document.addEventListener('mousemove', onMouseMove);
                document.onmouseup = () => document.removeEventListener('mousemove', onMouseMove);
            }
        }

        const retroOS = new RetroOS();
    </script>
</body>
</html>
