<div style="font-family: 'Courier New', monospace; color: #ffffff; padding: 5px;">
    <div style="background: #00aaaa; color: #000; padding: 4px; font-weight: bold; margin-bottom: 15px; text-align: center;">
        --- DATABASE RECORD EDIT: BLOEDDRUK & UF MONITOR ---
    </div>

    <!-- RECORD FORMULIER INVOERVELDEN -->
    <table style="width: 100%; border-collapse: collapse; margin-bottom: 15px;">
        <tr>
            <td style="padding: 5px; width: 50%;">SYSTOLISCH (BOVENDRUK):</td>
            <td><input type="number" id="sys-val" style="background: #000; color: #ffff55; border: 1px solid #00aaaa; padding: 4px; width: 100px;"> mmHg</td>
        </tr>
        <tr>
            <td style="padding: 5px;">DIASTOLISCH (ONDERDRUK):</td>
            <td><input type="number" id="dia-val" style="background: #000; color: #ffff55; border: 1px solid #00aaaa; padding: 4px; width: 100px;"> mmHg</td>
        </tr>
        <tr>
            <td style="padding: 5px;">HARTSLAG (HR):</td>
            <td><input type="number" id="hr-val" style="background: #000; color: #ffff55; border: 1px solid #00aaaa; padding: 4px; width: 100px;"> BPM</td>
        </tr>
        <tr>
            <td style="padding: 5px;">UF ADVIES (LITER):</td>
            <td><input type="number" step="0.1" id="uf-val" style="background: #000; color: #ffff55; border: 1px solid #00aaaa; padding: 4px; width: 100px;"> L</td>
        </tr>
    </table>

    <!-- ACTIE KNOPPEN -->
    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
        <button onclick="commitRecord()" style="flex: 1; padding: 8px; background: #00aaaa; color: #000; border: 1px solid #fff; cursor: pointer; font-weight: bold;">
            [ F10 ] OPSLAAN IN DATABASE
        </button>
        <button onclick="fetchRecord()" style="padding: 8px; background: #000; color: #fff; border: 1px solid #00aaaa; cursor: pointer;">
            [ F5 ] HERLADEN
        </button>
    </div>

    <!-- UF STATUS WEERGAVE MET JUISTE KLEURCODERING -->
    <div id="uf-alert-banner" style="display: none; padding: 8px; text-align: center; font-weight: bold; margin-bottom: 15px; border: 1px solid #fff;"></div>

    <!-- DBASE DATA ROOSTER (LAATSTE RECORD) -->
    <div style="border: 1px solid #00aaaa; padding: 8px; background: #000055;">
        <div style="color: #00aaaa; margin-bottom: 5px; font-size: 12px;">LAATST OPGESLAGEN RECORD:</div>
        <div id="db-record-output" style="color: #ffff55; font-size: 13px;">
            GEEN GEGEVENS GELADEN.
        </div>
    </div>
</div>

<script>
    async function commitRecord() {
        let sys = parseFloat(document.getElementById('sys-val').value);
        let dia = parseFloat(document.getElementById('dia-val').value);
        let hr = parseFloat(document.getElementById('hr-val').value);
        let uf = parseFloat(document.getElementById('uf-val').value);

        if (isNaN(sys) || isNaN(dia) || isNaN(hr)) {
            alert("FOUT: Vul A.U.B. ten minste Systolisch, Diastolisch en Hartslag in.");
            return;
        }

        // --- UF KLEURCODERING LOGICA ---
        let alertBanner = document.getElementById('uf-alert-banner');
        if (!isNaN(uf)) {
            alertBanner.style.display = "block";
            if (uf >= 4.5) {
                alertBanner.style.background = "#ff0000";
                alertBanner.style.color = "#ffffff";
                alertBanner.innerText = "UF STATUS: " + uf + "L [ ROOD - KRITISCH HOOG ]";
            } else if (uf >= 4.0) {
                alertBanner.style.background = "#ffaa00";
                alertBanner.style.color = "#000000";
                alertBanner.innerText = "UF STATUS: " + uf + "L [ ORANJE - WAARSCHUWING ]";
            } else {
                alertBanner.style.background = "#00aa00";
                alertBanner.style.color = "#ffffff";
                alertBanner.innerText = "UF STATUS: " + uf + "L [ GROEN - NORMAAL ]";
            }
        }

        let recordData = JSON.stringify({
            timestamp: new Date().toISOString(),
            sys: sys, dia: dia, hr: hr, uf: uf || 0
        });

        // Bepaal de actieve OS instantie
        let activeOS = typeof dbOS !== 'undefined' ? dbOS : (typeof retroOS !== 'undefined' ? retroOS : winOS);

        if (activeOS) {
            let ok = await activeOS.saveData('bloeddruk_record', recordData);
            if (ok) {
                document.getElementById('db-record-output').innerHTML = `RECORD COMITTED > SYS: ${sys} | DIA: ${dia} | HR: ${hr} | UF: ${uf || 0}L`;
            }
        }
    }

    async function fetchRecord() {
        let activeOS = typeof dbOS !== 'undefined' ? dbOS : (typeof retroOS !== 'undefined' ? retroOS : winOS);
        if (activeOS) {
            let data = await activeOS.loadData();
            if (data['bloeddruk_record']) {
                try {
                    let rec = JSON.parse(data['bloeddruk_record']);
                    document.getElementById('db-record-output').innerHTML = `
                        DATUM: ${new Date(rec.timestamp).toLocaleDateString()}<br>
                        SYS: ${rec.sys} mmHg | DIA: ${rec.dia} mmHg | HR: ${rec.hr} BPM | UF: ${rec.uf} L
                    `;
                } catch(e) {
                    document.getElementById('db-record-output').innerText = data['bloeddruk_record'];
                }
            }
        }
    }
</script>
