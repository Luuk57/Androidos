<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moonbase Alpha OS - Space 1999 Edition</title>
    <style>
        :root {
            --bg-color: #080a0f;
            --panel-bg: #111622;
            --accent-orange: #ff7700;
            --accent-green: #00ff66;
            --accent-red: #ff3333;
            --text-main: #ffbb55;
            --border-retro: 2px solid #ff7700;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; text-transform: uppercase; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg-color); color: var(--text-main); }

        /* CRT Scanline Effect */
        body::after {
            content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 99999; background-size: 100% 3px, 3px 100%; pointer-events: none;
        }

        /* Achtergrond Sterren / Raster */
        #wallpaper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a2238 0%, #05070a 100%);
            z-index: 0;
        }

        /* Inlogscherm (Alpha Security) */
        #lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 10, 15, 0.95); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.4s ease;
        }
        .lock-box {
            background: var(--panel-bg); border: var(--border-retro);
            padding: 40px; box-shadow: 0 0 25px rgba(255, 119, 0, 0.4);
            text-align: center; width: 380px;
        }
        .lock-box h2 { color: var(--accent-orange); margin-bottom: 10px; letter-spacing: 3px; font-size: 20px; }
        .lock-box p { font-size: 10px; color: #8899aa; margin-bottom: 25px; }
        .lock-box input {
            width: 100%; padding: 12px; margin-bottom: 15px; background: #000;
            border: 1px solid var(--accent-orange); color: var(--accent-green); text-align: center; font-size: 16px;
        }
        .lock-box button {
            width: 100%; padding: 12px; background: var(--accent-orange); border: none;
            color: #000; font-weight: bold; cursor: pointer; font-size: 14px; letter-spacing: 2px; transition: 0.2s;
        }
        .lock-box button:hover { background: #ffaa33; }

        #desktop { position: relative; width: 100%; height: 100%; z-index: 1; display: none; }

        /* Alpha Taakbalk Onderaan */
        .taskbar {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 50px;
            background: var(--panel-bg); border-top: var(--border-retro);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; z-index: 1000;
        }
        .taskbar-left, .taskbar-right { display: flex; align-items: center; gap: 10px; }
        .taskbar-btn {
            background: #000; border: 1px solid var(--accent-orange); color: var(--accent-orange);
            padding: 8px 14px; cursor: pointer; font-size: 11px; letter-spacing: 1px; transition: 0.2s;
        }
        .taskbar-btn:hover { background: var(--accent-orange); color: #000; }
        
        .sys-tray {
            font-size: 11px; color: var(--accent-green); display: flex; align-items: center; gap: 15px;
            border: 1px solid rgba(0,255,102,0.3); padding: 5px 10px; background: #000;
        }

        /* Venstersysteem in Space 1999 Stijl */
        .window {
            position: absolute; top: 70px; left: 100px; width: 620px; height: 460px;
            background: var(--panel-bg); border: var(--border-retro);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; overflow: hidden; resize: both; z-index: 10;
        }
        .window-header {
            background: #1a2238; padding: 8px 12px; display: flex;
            justify-content: space-between; align-items: center; cursor: move; user-select: none;
            border-bottom: 1px solid var(--accent-orange);
        }
        .window-title { font-size: 12px; font-weight: bold; color: var(--accent-orange); letter-spacing: 2px; }
        
        /* Bovenste knoppenbalk: Minimaliseren, Maximaliseren, Uitdien (Sluiten) */
        .window-controls { display: flex; align-items: center; gap: 4px; }
        .window-controls button {
            background: #000; border: 1px solid var(--accent-orange); width: 28px; height: 24px; cursor: pointer;
            font-size: 11px; color: var(--accent-orange); display: flex; align-items: center; justify-content: center; transition: 0.1s;
        }
        .window-controls button:hover { background: var(--accent-orange); color: #000; }
        .window-controls .btn-close:hover { background: var(--accent-red); border-color: var(--accent-red); color: #fff; }

        .window-content { padding: 20px; flex-grow: 1; overflow-y: auto; background: #0b0f17; color: #fff; font-size: 13px; }

        /* Instellingen Popup */
        .settings-popup {
            position: absolute; bottom: 60px; right: 20px; width: 340px;
            background: var(--panel-bg); border: var(--border-retro);
            padding: 20px; z-index: 2000; display: none; box-shadow: 0 0 20px rgba(255,119,0,0.3);
        }
        .settings-popup label { display: block; margin-bottom: 15px; font-size: 11px; color: #8899aa; }
        .settings-popup input[type="text"] { width: 100%; padding: 8px; background: #000; border: 1px solid var(--accent-orange); color: var(--accent-green); margin-top: 5px; font-size: 12px; }
    </style>
</head>
<body>

    <div id="wallpaper"></div>

    <!-- Inlogscherm Moonbase Alpha -->
    <div id="lock-screen">
        <div class="lock-box">
            <h2>MOONBASE ALPHA</h2>
            <p>Main Computer Security Terminal</p>
            <input type="password" id="pass-input" placeholder="Enter Security Code...">
            <button onclick="alphaOS.login()">AUTHORIZE ACCESS</button>
            <button onclick="alphaOS.toggleLogin(false)" style="background:transparent; border:none; color:#556677; margin-top:15px; cursor:pointer; font-size:9px;">Disable Security Bypass</button>
        </div>
    </div>

    <!-- Desktop -->
    <div id="desktop">
        <div class="taskbar">
            <div class="taskbar-left">
                <button class="taskbar-btn" onclick="alphaOS.openSettings()">[SYS] CONFIG</button>
                <button class="taskbar-btn" onclick="alphaOS.openAppPrompt()">[+] LOAD MODULE</button>
            </div>
            <div class="taskbar-right">
                <div class="sys-tray">
                    <span style="color:var(--accent-orange);">ALPHA-NET: ACTIVE</span>
                    <span id="system-time">00:00:00</span>
                    <span id="system-date">01.01.1999</span>
                </div>
            </div>
        </div>

        <!-- Instellingen Popup -->
        <div id="settings-panel" class="settings-popup">
            <h3 style="color: var(--accent-orange); margin-bottom: 15px; font-size: 13px; letter-spacing: 1px;">Alpha System Controls</h3>
            <label>
                <input type="checkbox" id="login-toggle-check" onchange="alphaOS.toggleLoginSetting(this)"> Security Login Active
            </label>
            <label>
                Google Sheets Webhook URL:
                <input type="text" id="sheets-url-input" placeholder="https://script.google.com/macros/s/.../exec">
            </label>
            <button class="taskbar-btn" style="width:100%; margin-top:10px; background:var(--accent-orange); color:#000;" onclick="alphaOS.saveSettings()">Save Configuration</button>
        </div>
    </div>

    <script>
        /* --- SPACE 1999 AUDIO COMPUTER BIPS --- */
        const SoundFX = {
            ctx: null,
            init() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            play(freq, duration, type='square') {
                try {
                    this.init();
                    let osc = this.ctx.createOscillator();
                    let gain = this.ctx.createGain();
                    osc.type = type; osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.00001, this.ctx.currentTime + duration);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            },
            startup() { [440, 880, 1320, 1760].forEach((f, i) => setTimeout(() => this.play(f, 0.1, 'square'), i * 80)); },
            click() { this.play(1200, 0.02, 'sawtooth'); }
        };

        class SpaceOS {
            constructor() {
                this.loginEnabled = localStorage.getItem('alpha_login') !== 'false';
                this.sheetsUrl = localStorage.getItem('alpha_sheets') || '';

                document.getElementById('sheets-url-input').value = this.sheetsUrl;
                document.getElementById('login-toggle-check').checked = this.loginEnabled;

                if (!this.loginEnabled) {
                    document.getElementById('lock-screen').style.display = 'none';
                    document.getElementById('desktop').style.display = 'block';
                    SoundFX.startup();
                }

                setInterval(() => {
                    let d = new Date();
                    document.getElementById('system-time').innerText = d.toLocaleTimeString();
                    document.getElementById('system-date').innerText = d.toLocaleDateString();
                }, 1000);
            }

            login() {
                SoundFX.play(1500, 0.15);
                document.getElementById('lock-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('lock-screen').style.display = 'none';
                    document.getElementById('desktop').style.display = 'block';
                    SoundFX.startup();
                }, 400);
            }

            toggleLogin(enabled) {
                this.loginEnabled = enabled;
                localStorage.setItem('alpha_login', enabled);
                if(!enabled) this.login();
            }

            toggleLoginSetting(el) {
                this.toggleLogin(el.checked);
            }

            openSettings() {
                SoundFX.click();
                let panel = document.getElementById('settings-panel');
                panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
            }

            saveSettings() {
                this.sheetsUrl = document.getElementById('sheets-url-input').value;
                localStorage.setItem('alpha_sheets', this.sheetsUrl);
                SoundFX.click();
                this.openSettings();
            }

            async saveData(key, value) {
                if(!this.sheetsUrl) {
                    alert("ERROR: No Google Sheets Webhook configured in system settings.");
                    return false;
                }
                try {
                    await fetch(this.sheetsUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ action: 'save', key: key, value: value })
                    });
                    return true;
                } catch(e) {
                    alert("TRANSMISSION ERROR: " + e.message);
                    return false;
                }
            }

            async loadData() {
                if(!this.sheetsUrl) return {};
                try {
                    let res = await fetch(this.sheetsUrl);
                    let data = await res.json();
                    return data;
                } catch(e) {
                    return {};
                }
            }

            openAppPrompt() {
                SoundFX.click();
                let url = prompt("ENTER MODULE HTML URL (GITHUB RAW LINK):");
                if(url) this.loadHTMLApp(url);
            }

            async loadHTMLApp(url) {
                try {
                    SoundFX.click();
                    let res = await fetch(url);
                    let htmlContent = await res.text();

                    let winId = 'win-' + Date.now();
                    let win = document.createElement('div');
                    win.className = 'window';
                    win.id = winId;
                    win.innerHTML = `
                        <div class="window-header" onmousedown="alphaOS.initDrag(event, '${winId}')">
                            <span class="window-title">[MODULE ACTIVE]</span>
                            <div class="window-controls">
                                <button onclick="alphaOS.minimizeWindow('${winId}')" title="Minimize">_</button>
                                <button onclick="alphaOS.maximizeWindow('${winId}')" title="Maximize">[]</button>
                                <button class="btn-close" onclick="document.getElementById('${winId}').remove()" title="Terminate">X</button>
                            </div>
                        </div>
                        <div class="window-content" id="content-${winId}"></div>
                    `;
                    document.getElementById('desktop').appendChild(win);
                    document.getElementById(`content-${winId}`).innerHTML = htmlContent;

                    let scripts = document.getElementById(`content-${winId}`).querySelectorAll('script');
                    scripts.forEach(s => {
                        let ns = document.createElement('script');
                        ns.text = s.innerHTML;
                        document.body.appendChild(ns);
                    });
                } catch(e) {
                    alert("FAILED TO LOAD MODULE: " + e.message);
                }
            }

            maximizeWindow(winId) {
                SoundFX.click();
                let win = document.getElementById(winId);
                if(win.dataset.maximized === 'true') {
                    win.style.top = win.dataset.prevTop;
                    win.style.left = win.dataset.prevLeft;
                    win.style.width = win.dataset.prevWidth;
                    win.style.height = win.dataset.prevHeight;
                    win.dataset.maximized = 'false';
                } else {
                    win.dataset.prevTop = win.style.top;
                    win.dataset.prevLeft = win.style.left;
                    win.dataset.prevWidth = win.style.width;
                    win.dataset.prevHeight = win.style.height;
                    win.style.top = '10px';
                    win.style.left = '10px';
                    win.style.width = 'calc(100vw - 20px)';
                    win.style.height = 'calc(100vh - 70px)';
                    win.dataset.maximized = 'true';
                }
            }

            minimizeWindow(winId) {
                SoundFX.click();
                document.getElementById(winId).style.display = 'none';
            }

            initDrag(e, winId) {
                let win = document.getElementById(winId);
                let startX = e.clientX, startY = e.clientY;
                let startLeft = win.offsetLeft, startTop = win.offsetTop;

                function onMouseMove(e) {
                    win.style.left = (startLeft + e.clientX - startX) + 'px';
                    win.style.top = (startTop + e.clientY - startY) + 'px';
                }
                document.addEventListener('mousemove', onMouseMove);
                document.onmouseup = () => document.removeEventListener('mousemove', onMouseMove);
            }
        }

        const alphaOS = new SpaceOS();
    </script>
</body>
</html>
