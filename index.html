<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniOS - Hybrid Network Edition</title>
    <style>
        :root {
            --bg-dark: #0f111a;
            --surface: rgba(26, 29, 46, 0.85);
            --accent: #4f46e5;
            --accent-glow: rgba(79, 70, 229, 0.4);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg-dark); color: var(--text-main); }

        /* Achtergrond */
        #wallpaper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #0f111a 70%);
            z-index: 0;
        }

        /* Inlogscherm */
        #lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 17, 26, 0.9); backdrop-filter: blur(20px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 0.4s ease;
        }
        .login-card {
            background: var(--surface); border: 1px solid var(--border);
            padding: 40px; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center; width: 340px; backdrop-filter: blur(10px);
        }
        .login-card h1 { font-size: 24px; margin-bottom: 5px; color: #fff; letter-spacing: 1px; }
        .login-card p { font-size: 13px; color: var(--text-muted); margin-bottom: 25px; }
        .login-card input {
            width: 100%; padding: 12px; margin-bottom: 15px; background: rgba(0,0,0,0.3);
            border: 1px solid var(--border); color: #fff; border-radius: 8px; text-align: center; font-size: 14px;
        }
        .login-card button {
            width: 100%; padding: 12px; background: var(--accent); border: none;
            color: #fff; font-weight: 600; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 15px var(--accent-glow); transition: 0.2s;
        }
        .login-card button:hover { opacity: 0.9; transform: translateY(-1px); }

        /* Desktop & UI */
        #desktop { position: relative; width: 100%; height: 100%; z-index: 1; display: none; }

        /* Statusbalk Boven (Android/Chrome style) */
        .top-bar {
            position: absolute; top: 0; left: 0; width: 100%; height: 32px;
            background: rgba(15, 17, 26, 0.6); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border); display: flex; justify-content: space-between;
            align-items: center; padding: 0 15px; font-size: 12px; color: var(--text-muted); z-index: 1000;
        }

        /* Taakbalk Onder (Windows style) */
        .taskbar {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 56px;
            background: var(--surface); border-top: 1px solid var(--border);
            backdrop-filter: blur(15px); display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px; z-index: 1000;
        }
        .taskbar-group { display: flex; gap: 10px; align-items: center; }
        .os-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-main);
            padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: 0.2s;
            display: flex; align-items: center; gap: 6px;
        }
        .os-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--accent); }

        /* Venstersysteem */
        .window {
            position: absolute; top: 80px; left: 100px; width: 550px; height: 400px;
            background: rgba(20, 22, 35, 0.92); border: 1px solid var(--border);
            border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            display: flex; flex-direction: column; overflow: hidden; resize: both;
            backdrop-filter: blur(20px); z-index: 10;
        }
        .window-header {
            background: rgba(255,255,255,0.03); padding: 10px 15px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border); cursor: move; user-select: none;
        }
        .window-title { font-size: 13px; font-weight: 600; color: var(--text-main); }
        .window-controls button {
            background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 4px;
        }
        .window-controls button:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .window-content { padding: 20px; flex-grow: 1; overflow-y: auto; }

        /* Instellingen Paneel */
        .settings-modal {
            position: absolute; top: 50px; left: 20px; width: 320px;
            background: var(--surface); border: 1px solid var(--border);
            padding: 20px; border-radius: 12px; z-index: 2000; display: none;
            backdrop-filter: blur(20px); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .settings-modal label { display: block; margin-bottom: 15px; font-size: 12px; color: var(--text-muted); }
        .settings-modal input[type="text"] { width: 100%; padding: 8px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: #fff; border-radius: 6px; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- Achtergrond -->
    <div id="wallpaper"></div>

    <!-- Inlogscherm -->
    <div id="lock-screen">
        <div class="login-card">
            <h1>OmniOS</h1>
            <p>Hybrid Network Environment</p>
            <input type="password" id="pass-input" placeholder="Toegangscode (standaard: admin)">
            <button onclick="os.login()">INLOGGEN</button>
            <button onclick="os.toggleLogin(false)" style="background:transparent; border:none; color:var(--text-muted); margin-top:15px; cursor:pointer; font-size:11px;">Inlogbeveiliging uitschakelen</button>
        </div>
    </div>

    <!-- Desktop Omgeving -->
    <div id="desktop">
        <!-- Statusbalk Boven -->
        <div class="top-bar">
            <span>OmniOS v1.0 [Hybrid Kernel]</span>
            <span id="system-clock">00:00:00</span>
        </div>

        <!-- Taakbalk Onder -->
        <div class="taskbar">
            <div class="taskbar-group">
                <button class="os-btn" onclick="os.openSettings()">⚙ Systeem</button>
                <button class="os-btn" onclick="os.openAppPrompt()">+ App Installeren (.html)</button>
                <button class="os-btn" onclick="os.syncGoogleSheets()">☁ Google Sheets Sync</button>
            </div>
        </div>

        <!-- Instellingen Paneel -->
        <div id="settings-panel" class="settings-modal">
            <h3 style="font-size: 14px; margin-bottom: 15px; color: #fff;">Systeeminstellingen</h3>
            <label>
                <input type="checkbox" id="login-toggle-check" onchange="os.toggleLoginSetting(this)"> Inlogscherm bij opstarten
            </label>
            <label>
                Google Sheets Webhook URL:
                <input type="text" id="sheets-url-input" placeholder="https://script.google.com/...">
            </label>
            <button class="os-btn" style="width:100%; justify-content:center; background:var(--accent);" onclick="os.saveSettings()">Opslaan</button>
        </div>
    </div>

    <script>
        /* --- GELUIDSENGINE (Web Audio API) --- */
        const SoundFX = {
            ctx: null,
            init() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            playTone(freq, duration, type='sine') {
                try {
                    this.init();
                    let osc = this.ctx.createOscillator();
                    let gain = this.ctx.createGain();
                    osc.type = type; osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.00001, this.ctx.currentTime + duration);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            },
            startup() {
                [400, 600, 900].forEach((f, i) => setTimeout(() => this.playTone(f, 0.15, 'triangle'), i * 100));
            }
        };

        /* --- OS KERN --- */
        class OmniOS {
            constructor() {
                this.loginEnabled = localStorage.getItem('omni_login') !== 'false';
                this.sheetsUrl = localStorage.getItem('omni_sheets') || '';
                
                document.getElementById('sheets-url-input').value = this.sheetsUrl;
                document.getElementById('login-toggle-check').checked = this.loginEnabled;

                if (!this.loginEnabled) {
                    document.getElementById('lock-screen').style.display = 'none';
                    document.getElementById('desktop').style.display = 'block';
                    SoundFX.startup();
                }

                setInterval(() => {
                    document.getElementById('system-clock').innerText = new Date().toLocaleTimeString();
                }, 1000);
            }

            login() {
                SoundFX.playTone(700, 0.1);
                document.getElementById('lock-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('lock-screen').style.display = 'none';
                    document.getElementById('desktop').style.display = 'block';
                    SoundFX.startup();
                }, 400);
            }

            toggleLogin(enabled) {
                this.loginEnabled = enabled;
                localStorage.setItem('omni_login', enabled);
                if(!enabled) this.login();
            }

            toggleLoginSetting(el) {
                this.toggleLogin(el.checked);
            }

            openSettings() {
                SoundFX.playTone(350, 0.05);
                let panel = document.getElementById('settings-panel');
                panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
            }

            saveSettings() {
                this.sheetsUrl = document.getElementById('sheets-url-input').value;
                localStorage.setItem('omni_sheets', this.sheetsUrl);
                SoundFX.playTone(800, 0.1);
                this.openSettings();
            }

            openAppPrompt() {
                let url = prompt("Voer de URL in van je HTML-app (bijv. raw GitHub link naar een .html bestand):");
                if(url) this.loadHTMLApp(url);
            }

            async loadHTMLApp(url) {
                try {
                    SoundFX.playTone(500, 0.1);
                    let res = await fetch(url);
                    let htmlContent = await res.text();

                    let winId = 'window-' + Date.now();
                    let win = document.createElement('div');
                    win.className = 'window';
                    win.id = winId;
                    win.innerHTML = `
                        <div class="window-header" onmousedown="os.initDrag(event, '${winId}')">
                            <span class="window-title">Externe App</span>
                            <div class="window-controls">
                                <button onclick="document.getElementById('${winId}').remove()">✕</button>
                            </div>
                        </div>
                        <div class="window-content" id="content-${winId}"></div>
                    `;
                    document.getElementById('desktop').appendChild(win);
                    document.getElementById(`content-${winId}`).innerHTML = htmlContent;

                    // Voer eventuele scripts in de geladen app uit
                    let scripts = document.getElementById(`content-${winId}`).querySelectorAll('script');
                    scripts.forEach(script => {
                        let newScript = document.createElement('script');
                        newScript.text = script.innerHTML;
                        document.body.appendChild(newScript);
                    });
                } catch(e) {
                    alert("Kan app niet laden: " + e.message);
                }
            }

            initDrag(e, winId) {
                let win = document.getElementById(winId);
                let startX = e.clientX, startY = e.clientY;
                let startLeft = win.offsetLeft, startTop = win.offsetTop;

                function onMouseMove(e) {
                    win.style.left = (startLeft + e.clientX - startX) + 'px';
                    win.style.top = (startTop + e.clientY - startY) + 'px';
                }
                document.addEventListener('mousemove', onMouseMove);
                document.onmouseup = () => document.removeEventListener('mousemove', onMouseMove);
            }

            async syncGoogleSheets() {
                if(!this.sheetsUrl) {
                    alert("Stel eerst je Google Sheets Webhook URL in via Systeem instellingen.");
                    this.openSettings();
                    return;
                }
                SoundFX.playTone(650, 0.1);
                try {
                    await fetch(this.sheetsUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ action: 'sync', time: new Date().toISOString() })
                    });
                    alert("Synchronisatie naar Google Sheets succesvol verzonden!");
                } catch(e) {
                    alert("Fout bij synchroniseren: " + e.message);
                }
            }
        }

        const os = new OmniOS();
    </script>
</body>
</html>
