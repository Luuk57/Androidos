<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 12 Network Edition</title>
    <style>
        :root {
            --win-bg: rgba(243, 243, 243, 0.88);
            --win-border: rgba(200, 200, 200, 0.4);
            --accent: #0067c0;
            --text-main: #1f1f1f;
            --taskbar-bg: rgba(255, 255, 255, 0.80);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; color: var(--text-main); }

        /* Achtergrond */
        #wallpaper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%);
            z-index: 0;
        }

        /* Inlogscherm */
        #lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(43, 88, 118, 0.9), rgba(78, 67, 118, 0.9));
            backdrop-filter: blur(25px); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.5s ease;
        }
        .lock-box {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            text-align: center; width: 320px; backdrop-filter: blur(10px); color: #fff;
        }
        .lock-avatar {
            width: 80px; height: 80px; background: #0067c0; border-radius: 50%;
            margin: 0 auto 20px auto; display: flex; align-items: center; justify-content: center;
            font-size: 32px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .lock-box input {
            width: 100%; padding: 10px 14px; margin-bottom: 15px; background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.3); color: #fff; border-radius: 6px; text-align: center; font-size: 14px;
        }
        .lock-box input::placeholder { color: rgba(255,255,255,0.6); }
        .lock-box button {
            width: 100%; padding: 10px; background: var(--accent); border: none;
            color: #fff; font-weight: 600; border-radius: 6px; cursor: pointer; transition: 0.2s;
        }
        .lock-box button:hover { background: #0078d4; }

        /* Desktop */
        #desktop { position: relative; width: 100%; height: 100%; z-index: 1; display: none; }

        /* Taakbalk (Windows 11 gecentreerd stijl met systeembalk rechts) */
        .taskbar {
            position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
            height: 52px; background: var(--taskbar-bg); border: 1px solid var(--win-border);
            backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: space-between;
            width: 95%; max-width: 900px; padding: 0 15px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 1000;
        }
        .taskbar-left, .taskbar-right { display: flex; align-items: center; gap: 6px; }
        .taskbar-center { display: flex; align-items: center; gap: 8px; position: absolute; left: 50%; transform: translateX(-50%); }

        .taskbar-btn {
            background: transparent; border: none; color: #1f1f1f; padding: 8px 12px;
            border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500;
            display: flex; align-items: center; gap: 6px; transition: 0.2s;
        }
        .taskbar-btn:hover { background: rgba(0, 0, 0, 0.06); }
        .sys-tray {
            font-size: 12px; font-weight: 500; color: #1f1f1f; padding: 6px 10px; border-radius: 6px;
            cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s;
        }
        .sys-tray:hover { background: rgba(0, 0, 0, 0.06); }

        /* Venster Systeem */
        .window {
            position: absolute; top: 80px; left: 120px; width: 600px; height: 450px;
            background: var(--win-bg); border: 1px solid var(--win-border);
            border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            display: flex; flex-direction: column; overflow: hidden; resize: both;
            backdrop-filter: blur(30px); z-index: 10;
        }
        .window-header {
            background: transparent; padding: 10px 14px; display: flex;
            justify-content: space-between; align-items: center; cursor: move; user-select: none;
        }
        .window-title { font-size: 13px; font-weight: 600; color: #333; display: flex; align-items: center; gap: 6px; }
        .window-controls { display: flex; align-items: center; gap: 2px; }
        .window-controls button {
            background: none; border: none; width: 34px; height: 28px; cursor: pointer;
            font-size: 12px; color: #333; border-radius: 4px; display: flex; align-items: center; justify-content: center; transition: 0.1s;
        }
        .window-controls button:hover { background: rgba(0,0,0,0.08); }
        .window-controls .btn-close:hover { background: #e81123; color: #fff; }
        
        .window-content { padding: 20px; flex-grow: 1; overflow-y: auto; background: rgba(255,255,255,0.4); }

        /* Systeeminstellingen Popup */
        .settings-popup {
            position: absolute; bottom: 75px; right: 20px; width: 320px;
            background: rgba(255, 255, 255, 0.92); border: 1px solid var(--win-border);
            padding: 20px; border-radius: 14px; z-index: 2000; display: none;
            backdrop-filter: blur(25px); box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .settings-popup label { display: block; margin-bottom: 12px; font-size: 12px; font-weight: 500; color: #333; }
        .settings-popup input[type="text"] { width: 100%; padding: 8px; background: #fff; border: 1px solid #ccc; border-radius: 6px; margin-top: 4px; font-size: 12px; }
    </style>
</head>
<body>

    <!-- Achtergrond -->
    <div id="wallpaper"></div>

    <!-- Inlogscherm -->
    <div id="lock-screen">
        <div class="lock-box">
            <div class="lock-avatar">👤</div>
            <h2 style="margin-bottom: 5px; font-size: 18px;">Administrator</h2>
            <p style="font-size: 11px; color: rgba(255,255,255,0.7); margin-bottom: 20px;">Windows 12 Netwerk Editie</p>
            <input type="password" id="pass-input" placeholder="Pincode of wachtwoord...">
            <button onclick="winOS.login()">Aanmelden</button>
            <button onclick="winOS.toggleLogin(false)" style="background:transparent; border:none; color:rgba(255,255,255,0.7); margin-top:15px; cursor:pointer; font-size:11px; text-decoration: underline;">Inlogscherm uitschakelen</button>
        </div>
    </div>

    <!-- Desktop -->
    <div id="desktop">
        <!-- Taakbalk -->
        <div class="taskbar">
            <div class="taskbar-left">
                <button class="taskbar-btn" onclick="winOS.openSettings()" title="Instellingen">⚙ Instellingen</button>
                <button class="taskbar-btn" onclick="winOS.openAppPrompt()" title="App Installeren">+ App Laden</button>
                <button class="taskbar-btn" onclick="winOS.syncGoogleSheets()" title="Cloud Sync">☁ Sheets Sync</button>
            </div>
            <div class="taskbar-center">
                <!-- Vrij te gebruiken centrale knoppen of status -->
            </div>
            <div class="taskbar-right">
                <div class="sys-tray" onclick="winOS.openSettings()" title="Systeemstatus, Tijd en Datum">
                    <span id="system-tray-icons">🔊 🌐</span>
                    <div style="text-align: right; line-height: 1.2;">
                        <div id="system-time">00:00</div>
                        <div id="system-date" style="font-size: 10px; color: #555;">01-01-2026</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Instellingen Popup -->
        <div id="settings-panel" class="settings-popup">
            <h3 style="font-size: 14px; margin-bottom: 15px; color: #000; font-weight: 600;">Systeemvoorkeuren</h3>
            <label>
                <input type="checkbox" id="login-toggle-check" onchange="winOS.toggleLoginSetting(this)"> Inlogscherm tonen bij opstarten
            </label>
            <label>
                Google Sheets Webhook URL:
                <input type="text" id="sheets-url-input" placeholder="https://script.google.com/macros/s/.../exec">
            </label>
            <button class="taskbar-btn" style="width:100%; justify-content:center; background:var(--accent); color:#fff; margin-top:10px;" onclick="winOS.saveSettings()">Wijzigingen Opslaan</button>
        </div>
    </div>

    <script>
        /* --- AUDIO GELUIDSENGINE --- */
        const SoundFX = {
            ctx: null,
            init() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            play(freq, duration, type='sine') {
                try {
                    this.init();
                    let osc = this.ctx.createOscillator();
                    let gain = this.ctx.createGain();
                    osc.type = type; osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.00001, this.ctx.currentTime + duration);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            },
            startup() { [523.25, 659.25, 783.99].forEach((f, i) => setTimeout(() => this.play(f, 0.12, 'triangle'), i * 100)); },
            click() { this.play(800, 0.03, 'sine'); }
        };

        /* --- OS LOGICA --- */
        class WindowsOS {
            constructor() {
                this.loginEnabled = localStorage.getItem('win_login') !== 'false';
                this.sheetsUrl = localStorage.getItem('win_sheets') || '';

                document.getElementById('sheets-url-input').value = this.sheetsUrl;
                document.getElementById('login-toggle-check').checked = this.loginEnabled;

                if (!this.loginEnabled) {
                    document.getElementById('lock-screen').style.display = 'none';
                    document.getElementById('desktop').style.display = 'block';
                    SoundFX.startup();
                }

                // Live tijd en datum updater
                setInterval(() => {
                    let d = new Date();
                    document.getElementById('system-time').innerText = d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    document.getElementById('system-date').innerText = d.toLocaleDateString([], {day: '2-digit', month: '2-digit', year: 'numeric'});
                }, 1000);
            }

            login() {
                SoundFX.play(600, 0.1);
                document.getElementById('lock-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('lock-screen').style.display = 'none';
                    document.getElementById('desktop').style.display = 'block';
                    SoundFX.startup();
                }, 400);
            }

            toggleLogin(enabled) {
                this.loginEnabled = enabled;
                localStorage.setItem('win_login', enabled);
                if(!enabled) this.login();
            }

            toggleLoginSetting(el) {
                this.toggleLogin(el.checked);
            }

            openSettings() {
                SoundFX.click();
                let panel = document.getElementById('settings-panel');
                panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
            }

            saveSettings() {
                this.sheetsUrl = document.getElementById('sheets-url-input').value;
                localStorage.setItem('win_sheets', this.sheetsUrl);
                SoundFX.click();
                this.openSettings();
            }

            openAppPrompt() {
                SoundFX.click();
                let url = prompt("Voer de URL in van het HTML-bestand van je app (bijv. GitHub raw URL):");
                if(url) this.loadHTMLApp(url);
            }

            async loadHTMLApp(url) {
                try {
                    SoundFX.click();
                    let res = await fetch(url);
                    let htmlContent = await res.text();

                    let winId = 'win-' + Date.now();
                    let win = document.createElement('div');
                    win.className = 'window';
                    win.id = winId;
                    win.innerHTML = `
                        <div class="window-header" onmousedown="winOS.initDrag(event, '${winId}')">
                            <span class="window-title">📁 Externe App</span>
                            <div class="window-controls">
                                <button onclick="winOS.minimizeWindow('${winId}')" title="Minimaliseren">&#9647;</button>
                                <button onclick="winOS.maximizeWindow('${winId}')" title="Maximaliseren / Herstellen">&#x25A2;</button>
                                <button class="btn-close" onclick="document.getElementById('${winId}').remove()" title="Sluiten">&#x2715;</button>
                            </div>
                        </div>
                        <div class="window-content" id="content-${winId}"></div>
                    `;
                    document.getElementById('desktop').appendChild(win);
                    document.getElementById(`content-${winId}`).innerHTML = htmlContent;

                    // Voer scripts in de geladen app uit indien aanwezig
                    let scripts = document.getElementById(`content-${winId}`).querySelectorAll('script');
                    scripts.forEach(s => {
                        let ns = document.createElement('script');
                        ns.text = s.innerHTML;
                        document.body.appendChild(ns);
                    });
                } catch(e) {
                    alert("Fout bij laden van app: " + e.message);
                }
            }

            maximizeWindow(winId) {
                SoundFX.click();
                let win = document.getElementById(winId);
                if(win.dataset.maximized === 'true') {
                    win.style.top = win.dataset.prevTop;
                    win.style.left = win.dataset.prevLeft;
                    win.style.width = win.dataset.prevWidth;
                    win.style.height = win.dataset.prevHeight;
                    win.dataset.maximized = 'false';
                } else {
                    win.dataset.prevTop = win.style.top;
                    win.dataset.prevLeft = win.style.left;
                    win.dataset.prevWidth = win.style.width;
                    win.dataset.prevHeight = win.style.height;
                    win.style.top = '10px';
                    win.style.left = '10px';
                    win.style.width = 'calc(100vw - 20px)';
                    win.style.height = 'calc(100vh - 75px)';
                    win.dataset.maximized = 'true';
                }
            }

            minimizeWindow(winId) {
                SoundFX.click();
                document.getElementById(winId).style.display = 'none';
            }

            initDrag(e, winId) {
                let win = document.getElementById(winId);
                let startX = e.clientX, startY = e.clientY;
                let startLeft = win.offsetLeft, startTop = win.offsetTop;

                function onMouseMove(e) {
                    win.style.left = (startLeft + e.clientX - startX) + 'px';
                    win.style.top = (startTop + e.clientY - startY) + 'px';
                }
                document.addEventListener('mousemove', onMouseMove);
                document.onmouseup = () => document.removeEventListener('mousemove', onMouseMove);
            }

            async syncGoogleSheets() {
                if(!this.sheetsUrl) {
                    alert("Vul eerst je Google Sheets Webhook URL in via Systeeminstellingen.");
                    this.openSettings();
                    return;
                }
                SoundFX.click();
                try {
                    await fetch(this.sheetsUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ action: 'sync', time: new Date().toISOString() })
                    });
                    alert("Succesvol gesynchroniseerd met Google Sheets!");
                } catch(e) {
                    alert("Synchronisatiefout: " + e.message);
                }
            }
        }

        const winOS = new WindowsOS();
    </script>
</body>
</html>
